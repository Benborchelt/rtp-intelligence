<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Spline+Sans+Mono:wght@400..600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: radial-gradient(ellipse 45% 80% at 15% 45%, rgba(232,180,79,0.09), transparent 65%), #12100b;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 90px;
    font-family: "Fraunces", serif;
    overflow: hidden;
  }
  .copy h1 { color: #ede8df; font-size: 64px; font-weight: 420; line-height: 1.08; letter-spacing: -0.01em; }
  .copy h1 em {
    font-weight: 380;
    background: linear-gradient(100deg, #a8833b, #e8b44f 55%, #efc26a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .eyebrow { font-family: "Spline Sans Mono", monospace; font-size: 15px; letter-spacing: 0.34em; text-transform: uppercase; color: #d3a448; margin-bottom: 30px; }
  .rule { width: 76px; height: 2px; background: linear-gradient(90deg, #d3a448, transparent); margin-top: 36px; }
  img { height: 430px; }
</style>
</head>
<body>
  <div class="copy">
    <p class="eyebrow">RTP Intelligence</p>
    <h1>Applied AI,<br /><em>built in the Triangle.</em></h1>
    <div class="rule"></div>
  </div>
  <img src="logo-full.png" alt="" />
</body>
</html>
